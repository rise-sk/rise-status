# Public status of rise.sk (Upptime: GitHub Actions every 5 min, outside our server; incidents become issues).
# Maintained with the server docs (rise-server:/srv/infra.git, docs/tools.md). Add every new public app here.
owner: rise-sk
repo: rise-status

sites:
  - name: rise.sk
    url: https://rise.sk
    maxResponseTime: 5000
  - name: rise.sk API health
    url: https://rise.sk/api/health
    maxResponseTime: 5000
  - name: Prihlásenie (admin nástroje)
    url: https://login.rise.sk/api/health
    maxResponseTime: 5000

secrets:
  - NOTIFICATION_DISCORD_WEBHOOK_URL

assignees:
  - Marosko123

status-website:
  cname: status.rise.sk
  name: rise.sk status
  introTitle: "**rise.sk** – dostupnosť služieb"
  introMessage: Kontroly bežia každých 5 minút mimo nášho servera (GitHub Actions). Výpadky sa zapisujú ako incidenty.
  theme: dark
  navbar:
    - title: Stav
      href: /
    - title: rise.sk
      href: https://rise.sk
